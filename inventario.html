<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventario · Maestro Hongo</title>
<style>
  :root {
    --bg: #EEF0E7;
    --surface: #FFFFFF;
    --surface-alt: #F7F5EE;
    --ink: #1C2321;
    --ink-muted: #6B7268;
    --principal: #1F6F5C;
    --principal-bg: #E4EFEA;
    --secundario: #B5762C;
    --secundario-bg: #F4E9D9;
    --alert: #B3261E;
    --alert-bg: #F8E4E1;
    --alert-border: #E7B6AF;
    --border: #DAD5C6;
    --border-strong: #BDB6A2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  h1, h2, h3 { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; margin: 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  .header p { margin: 4px 0 0; font-size: 14px; color: var(--ink-muted); }
  .icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-muted); }
  .icon-btn:hover { background: var(--surface-alt); }
  .banner { padding: 10px 14px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
  .banner.error { background: var(--alert-bg); color: var(--alert); border: 1px solid var(--alert-border); }
  .banner.alert { background: var(--alert-bg); border: 1px solid var(--alert-border); }
  .banner.alert .title { display: flex; align-items: center; gap: 6px; color: var(--alert); font-weight: 600; margin-bottom: 2px; }
  .controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
  .btn { border: none; cursor: pointer; border-radius: 6px; font-size: 14px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--principal); color: white; }
  .btn-secondary { background: var(--secundario); color: white; }
  .btn-outline { background: var(--surface); border: 1px solid var(--border); color: var(--ink); }
  .btn-outline.active { border-color: var(--alert); color: var(--alert); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .empty { background: var(--surface-alt); border: 1px dashed var(--border-strong); border-radius: 6px; padding: 24px; text-align: center; font-size: 14px; color: var(--ink-muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .card.low { border-color: var(--alert-border); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--surface-alt); color: var(--ink-muted); }
  .tag.low { background: var(--alert-bg); color: var(--alert); display: inline-flex; align-items: center; gap: 4px; }
  .card-actions button { background: none; border: none; cursor: pointer; padding: 6px; color: var(--ink-muted); }
  .card-actions button.del { color: var(--alert); }
  .stock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .stock-box { border-radius: 6px; padding: 8px 12px; }
  .stock-box.principal { background: var(--principal-bg); }
  .stock-box.secundario { background: var(--secundario-bg); }
  .stock-box .lbl { font-size: 12px; }
  .stock-box.principal .lbl { color: var(--principal); }
  .stock-box.secundario .lbl { color: var(--secundario); }
  .stock-box .val { font-size: 18px; }
  .unit { font-size: 12px; color: var(--ink-muted); }
  .row-actions { display: flex; gap: 8px; margin-top: 12px; }
  .row-actions button { font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .movs { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .mov-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 14px; }
  .mov-row .fecha { font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
  .mov-row .desc { flex: 1; }
  .mov-row .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .footer-note { font-size: 12px; color: var(--ink-muted); text-align: center; margin-top: 32px; }
  .overlay { position: fixed; inset: 0; background: rgba(28,35,33,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 8px; padding: 20px; width: 100%; max-width: 380px; }
  .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .modal-top button { background: none; border: none; cursor: pointer; color: var(--ink-muted); }
  .field { margin-bottom: 10px; }
  .field label { font-size: 12px; color: var(--ink-muted); display: block; margin-bottom: 2px; }
  .field input { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .loc-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
  .loc-toggle button { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 14px; }
  .loc-toggle button.sel-principal { border-color: var(--principal); background: var(--principal-bg); color: var(--principal); }
  .loc-toggle button.sel-secundario { border-color: var(--secundario); background: var(--secundario-bg); color: var(--secundario); }
  svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1 style="font-size:26px;">Inventario compartido</h1>
      <p>Punto principal → segundo punto (entregas) · Maestro Hongo</p>
    </div>
    <button class="icon-btn" id="btnRefresh" title="Actualizar">⟳</button>
  </div>

  <div id="errorBanner"></div>
  <div id="alertBanner"></div>

  <div class="controls">
    <button class="btn btn-outline" id="btnFiltro">Mostrar solo bajo stock</button>
    <button class="btn btn-primary" id="btnAgregar">+ Producto</button>
  </div>

  <div id="listaProductos"></div>

  <div id="historial"></div>

  <p class="footer-note" id="statusNote">Conectando…</p>
</div>

<!-- Modal agregar/editar -->
<div class="overlay" id="modalForm">
  <div class="modal">
    <div class="modal-top">
      <h3 id="formTitle" style="font-size:18px;">Nuevo producto</h3>
      <button onclick="cerrarModales()">✕</button>
    </div>
    <div class="field"><label>Nombre del producto</label><input id="fNombre" /></div>
    <div class="field"><label>SKU / referencia (opcional)</label><input id="fSku" /></div>
    <div class="two-col">
      <div class="field"><label>Stock principal</label><input id="fPrincipal" type="number" min="0" /></div>
      <div class="field"><label>Stock segundo punto</label><input id="fSecundario" type="number" min="0" /></div>
    </div>
    <div class="two-col">
      <div class="field"><label>Alerta bajo stock</label><input id="fUmbral" type="number" min="0" value="5" /></div>
      <div class="field"><label>Unidad</label><input id="fUnidad" value="uds" /></div>
    </div>
    <button class="btn btn-primary" id="btnGuardarForm" style="width:100%;justify-content:center;">Guardar</button>
  </div>
</div>

<!-- Modal traslado -->
<div class="overlay" id="modalTraslado">
  <div class="modal">
    <div class="modal-top">
      <h3 style="font-size:18px;">Trasladar</h3>
      <button onclick="cerrarModales()">✕</button>
    </div>
    <p id="traspInfo" style="font-size:14px;color:var(--ink-muted);margin-top:0;"></p>
    <div class="field"><label>Cantidad a trasladar</label><input id="traspCantidad" type="number" min="1" /></div>
    <button class="btn btn-secondary" id="btnConfirmarTraslado" style="width:100%;justify-content:center;">Confirmar traslado</button>
  </div>
</div>

<!-- Modal venta -->
<div class="overlay" id="modalVenta">
  <div class="modal">
    <div class="modal-top">
      <h3 style="font-size:18px;">Registrar venta</h3>
      <button onclick="cerrarModales()">✕</button>
    </div>
    <p id="ventaNombre" style="font-size:14px;color:var(--ink-muted);margin-top:0;"></p>
    <div class="loc-toggle">
      <button id="btnLocPrincipal">Principal</button>
      <button id="btnLocSecundario">Segundo punto</button>
    </div>
    <div class="field"><label>Cantidad vendida</label><input id="ventaCantidad" type="number" min="1" /></div>
    <button class="btn btn-primary" id="btnConfirmarVenta" style="width:100%;justify-content:center;">Confirmar venta</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, onSnapshot, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUAXEFVVvoIh4gvHvp0iD0QdLBZ-zOLus",
  authDomain: "inventario-maestro-hongo.firebaseapp.com",
  projectId: "inventario-maestro-hongo",
  storageBucket: "inventario-maestro-hongo.firebasestorage.app",
  messagingSenderId: "617925076909",
  appId: "1:617925076909:web:22773a0d73d494a4f82324"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "inventario", "principal");

let productos = [];
let movimientos = [];
let soloBajoStock = false;
let saleLoc = "principal";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtFecha = (iso) => {
  const d = new Date(iso);
  return d.toLocaleString("es-CO", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
};
const bajoStock = (p) => p.stockPrincipal <= p.umbral || p.stockSecundario <= p.umbral;

async function guardar() {
  try {
    await setDoc(ref, { productos, movimientos: movimientos.slice(0, 150) });
    document.getElementById("errorBanner").innerHTML = "";
  } catch (e) {
    document.getElementById("errorBanner").innerHTML =
      `<div class="banner error">No se pudo guardar el cambio. Revisa tu conexión e intenta de nuevo.</div>`;
  }
}

onSnapshot(ref, (snap) => {
  if (snap.exists()) {
    const data = snap.data();
    productos = data.productos || [];
    movimientos = data.movimientos || [];
  } else {
    productos = [];
    movimientos = [];
  }
  document.getElementById("statusNote").textContent =
    "Este inventario se sincroniza automáticamente entre todos los dispositivos que abran esta página.";
  render();
}, (err) => {
  document.getElementById("errorBanner").innerHTML =
    `<div class="banner error">Error de conexión con la base de datos: ${err.message}</div>`;
});

function render() {
  const alertas = productos.filter(bajoStock);
  const alertBanner = document.getElementById("alertBanner");
  alertBanner.innerHTML = alertas.length ? `
    <div class="banner alert">
      <div class="title">⚠ ${alertas.length} producto${alertas.length !== 1 ? "s" : ""} en bajo stock</div>
      <div>${alertas.map(a => a.nombre).join(" · ")}</div>
    </div>` : "";

  const lista = soloBajoStock ? alertas : productos;
  const cont = document.getElementById("listaProductos");
  if (!lista.length) {
    cont.innerHTML = `<div class="empty">${
      productos.length === 0
        ? "Todavía no hay productos. Agrega el primero con el botón de arriba."
        : "Ningún producto está en bajo stock ahora mismo."
    }</div>`;
  } else {
    cont.innerHTML = lista.map(p => {
      const low = bajoStock(p);
      return `
      <div class="card ${low ? "low" : ""}">
        <div class="card-top">
          <div>
            <strong>${p.nombre}</strong>
            ${p.sku ? `<span class="tag mono">${p.sku}</span>` : ""}
            ${low ? `<span class="tag low">⚠ bajo stock</span>` : ""}
          </div>
          <div class="card-actions">
            <button title="Editar" onclick="abrirEditar('${p.id}')">✎</button>
            <button title="Eliminar" class="del" onclick="eliminar('${p.id}')">🗑</button>
          </div>
        </div>
        <div class="stock-grid">
          <div class="stock-box principal">
            <div class="lbl">Principal</div>
            <div class="val mono">${p.stockPrincipal} <span class="unit">${p.unidad}</span></div>
          </div>
          <div class="stock-box secundario">
            <div class="lbl">Segundo punto</div>
            <div class="val mono">${p.stockSecundario} <span class="unit">${p.unidad}</span></div>
          </div>
        </div>
        <div class="row-actions">
          <button onclick="abrirTraslado('${p.id}')">⇄ Trasladar</button>
          <button onclick="abrirVenta('${p.id}')">🛒 Registrar venta</button>
        </div>
      </div>`;
    }).join("");
  }

  const hist = document.getElementById("historial");
  if (movimientos.length) {
    hist.innerHTML = `
      <h2 style="font-size:14px;color:var(--ink-muted);margin:24px 0 8px;">Últimos movimientos</h2>
      <div class="movs">
        ${movimientos.slice(0, 15).map((m, i) => `
          <div class="mov-row" style="background:${i % 2 === 0 ? "var(--surface)" : "var(--surface-alt)"};${i > 0 ? "border-top:1px solid var(--border);" : ""}">
            <span class="fecha mono">${fmtFecha(m.fecha)}</span>
            <span class="desc">${
              m.tipo === "traslado"
                ? `Traslado de <strong>${m.cantidad} ${m.unidad}</strong> de ${m.productoNombre} → segundo punto`
                : `Venta de <strong>${m.cantidad} ${m.unidad}</strong> de ${m.productoNombre} en ${m.ubicacion === "principal" ? "principal" : "segundo punto"}`
            }</span>
            <span class="badge" style="background:${m.tipo === "traslado" ? "var(--secundario-bg)" : "var(--principal-bg)"};color:${m.tipo === "traslado" ? "var(--secundario)" : "var(--principal)"};">${m.tipo}</span>
          </div>
        `).join("")}
      </div>`;
  } else {
    hist.innerHTML = "";
  }
}

// ---- Modal: agregar/editar ----
let editingId = null;
window.abrirEditar = (id) => {
  const p = productos.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById("formTitle").textContent = "Editar producto";
  document.getElementById("fNombre").value = p.nombre;
  document.getElementById("fSku").value = p.sku || "";
  document.getElementById("fPrincipal").value = p.stockPrincipal;
  document.getElementById("fSecundario").value = p.stockSecundario;
  document.getElementById("fUmbral").value = p.umbral;
  document.getElementById("fUnidad").value = p.unidad;
  document.getElementById("modalForm").classList.add("show");
};

document.getElementById("btnAgregar").onclick = () => {
  editingId = null;
  document.getElementById("formTitle").textContent = "Nuevo producto";
  ["fNombre","fSku"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("fPrincipal").value = "";
  document.getElementById("fSecundario").value = "";
  document.getElementById("fUmbral").value = "5";
  document.getElementById("fUnidad").value = "uds";
  document.getElementById("modalForm").classList.add("show");
};

document.getElementById("btnGuardarForm").onclick = () => {
  const nombre = document.getElementById("fNombre").value.trim();
  if (!nombre) return;
  const base = {
    nombre,
    sku: document.getElementById("fSku").value.trim(),
    stockPrincipal: Math.max(0, Number(document.getElementById("fPrincipal").value) || 0),
    stockSecundario: Math.max(0, Number(document.getElementById("fSecundario").value) || 0),
    umbral: Math.max(0, Number(document.getElementById("fUmbral").value) || 0),
    unidad: document.getElementById("fUnidad").value.trim() || "uds",
  };
  if (editingId) {
    productos = productos.map(p => p.id === editingId ? { ...p, ...base } : p);
  } else {
    productos = [{ id: uid(), ...base }, ...productos];
  }
  guardar();
  cerrarModales();
};

window.eliminar = (id) => {
  const p = productos.find(x => x.id === id);
  if (!p || !confirm(`¿Eliminar "${p.nombre}" del inventario?`)) return;
  productos = productos.filter(x => x.id !== id);
  guardar();
};

// ---- Modal: traslado ----
let transferTargetId = null;
window.abrirTraslado = (id) => {
  const p = productos.find(x => x.id === id);
  if (!p) return;
  transferTargetId = id;
  document.getElementById("traspInfo").textContent =
    `${p.nombre} · disponible en principal: ${p.stockPrincipal} ${p.unidad}`;
  document.getElementById("traspCantidad").value = "";
  document.getElementById("traspCantidad").max = p.stockPrincipal;
  document.getElementById("modalTraslado").classList.add("show");
};

document.getElementById("btnConfirmarTraslado").onclick = () => {
  const p = productos.find(x => x.id === transferTargetId);
  const cant = Number(document.getElementById("traspCantidad").value);
  if (!p || !cant || cant <= 0 || cant > p.stockPrincipal) return;
  productos = productos.map(x => x.id === p.id
    ? { ...x, stockPrincipal: x.stockPrincipal - cant, stockSecundario: x.stockSecundario + cant }
    : x);
  movimientos = [{ id: uid(), fecha: new Date().toISOString(), tipo: "traslado", productoNombre: p.nombre, cantidad: cant, unidad: p.unidad }, ...movimientos];
  guardar();
  cerrarModales();
};

// ---- Modal: venta ----
let saleTargetId = null;
window.abrirVenta = (id) => {
  const p = productos.find(x => x.id === id);
  if (!p) return;
  saleTargetId = id;
  saleLoc = "principal";
  document.getElementById("ventaNombre").textContent = p.nombre;
  document.getElementById("ventaCantidad").value = "";
  actualizarLocBotones(p);
  document.getElementById("modalVenta").classList.add("show");
};

function actualizarLocBotones(p) {
  const bp = document.getElementById("btnLocPrincipal");
  const bs = document.getElementById("btnLocSecundario");
  bp.textContent = `Principal (${p.stockPrincipal})`;
  bs.textContent = `Segundo punto (${p.stockSecundario})`;
  bp.className = saleLoc === "principal" ? "sel-principal" : "";
  bs.className = saleLoc === "secundario" ? "sel-secundario" : "";
}

document.getElementById("btnLocPrincipal").onclick = () => {
  saleLoc = "principal";
  actualizarLocBotones(productos.find(x => x.id === saleTargetId));
};
document.getElementById("btnLocSecundario").onclick = () => {
  saleLoc = "secundario";
  actualizarLocBotones(productos.find(x => x.id === saleTargetId));
};

document.getElementById("btnConfirmarVenta").onclick = () => {
  const p = productos.find(x => x.id === saleTargetId);
  const cant = Number(document.getElementById("ventaCantidad").value);
  const disponible = saleLoc === "principal" ? p.stockPrincipal : p.stockSecundario;
  if (!p || !cant || cant <= 0 || cant > disponible) return;
  productos = productos.map(x => {
    if (x.id !== p.id) return x;
    return saleLoc === "principal"
      ? { ...x, stockPrincipal: x.stockPrincipal - cant }
      : { ...x, stockSecundario: x.stockSecundario - cant };
  });
  movimientos = [{ id: uid(), fecha: new Date().toISOString(), tipo: "venta", productoNombre: p.nombre, cantidad: cant, unidad: p.unidad, ubicacion: saleLoc }, ...movimientos];
  guardar();
  cerrarModales();
};

window.cerrarModales = () => {
  document.querySelectorAll(".overlay").forEach(o => o.classList.remove("show"));
};

document.getElementById("btnFiltro").onclick = (e) => {
  soloBajoStock = !soloBajoStock;
  e.target.classList.toggle("active", soloBajoStock);
  e.target.textContent = soloBajoStock ? "Mostrando solo bajo stock" : "Mostrar solo bajo stock";
  render();
};

document.getElementById("btnRefresh").onclick = async () => {
  const snap = await getDoc(ref);
  if (snap.exists()) {
    const data = snap.data();
    productos = data.productos || [];
    movimientos = data.movimientos || [];
    render();
  }
};
</script>
</body>
</html>
